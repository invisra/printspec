[project]
name = "printspec"
version = "0.1.0"
description = "JSON schemas, validators, BOM helpers, CLI commands, and starter generators for practical parametric 3D-printable parts."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [
  { name = "Invisra" }
]
keywords = [
  "3d-printing",
  "cad",
  "json-schema",
  "openscad",
  "cadquery",
  "parametric",
  "bom"
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Manufacturing",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed"
]
dependencies = ["pydantic>=2", "jsonschema>=4", "referencing>=0.35"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
printspec = "printspec.cli:main"

[project.urls]
Homepage = "https://github.com/invisra/printspec"
Repository = "https://github.com/invisra/printspec"
Issues = "https://github.com/invisra/printspec/issues"
Schemas = "https://schemas.invisra.ai/printspec/"

[build-system]
requires = ["hatchling", "editables"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["printspec"]

[tool.hatch.build.targets.sdist]
include = [
  "printspec",
  "pyproject.toml",
  "README.md",
]
