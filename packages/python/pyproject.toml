[project]
name = "printspec"
version = "0.1.0"
description = "JSON schemas and helpers for practical parametric 3D-printable parts"
requires-python = ">=3.11"
dependencies = ["pydantic>=2", "jsonschema>=4", "referencing>=0.35"]
[project.optional-dependencies]
test = ["pytest>=8"]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel.force-include]
"../../schemas" = "printspec/schemas"
