[project]
name = "printspec"
version = "0.1.0"
description = "JSON schemas and helpers for practical parametric 3D-printable parts"
requires-python = ">=3.11"
dependencies = ["pydantic>=2", "jsonschema>=4", "referencing>=0.35"]
[project.optional-dependencies]
test = ["pytest>=8"]
[project.scripts]
printspec = "printspec.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["printspec"]

[tool.hatch.build.targets.sdist]
include = [
  "printspec",
  "pyproject.toml",
  "README.md",
]
