name: Release
on:
  workflow_dispatch:
    inputs:
      npm_version:
        description: 'npm package version to dry-run or release, for example 0.3.0'
        required: true
        default: '0.3.0'
      schema_version:
        description: 'Schema and Python package version, for example 0.2.0'
        required: true
        default: '0.2.0'
      dry_run:
        description: 'Keep publishing disabled'
        required: true
        default: true
        type: boolean
      publish_pypi:
        description: 'Also publish to PyPI (leave off until the invisra PyPI org / trusted publisher is approved)'
        required: true
        default: false
        type: boolean
jobs:
  release-checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: npm ci
      - name: Verify requested versions match independent release tracks
        run: |
          node - <<'NODE'
          import { readFileSync } from 'node:fs';

          const expectedNpm = process.env.INPUT_NPM_VERSION;
          const expectedSchema = process.env.INPUT_SCHEMA_VERSION;
          const schema = JSON.parse(readFileSync('package.json', 'utf8')).version;
          const npmPackage = JSON.parse(
            readFileSync('packages/typescript/package.json', 'utf8'),
          ).version;
          const pyMatch = readFileSync(
            'packages/python/pyproject.toml',
            'utf8',
          ).match(/^version = "([^"]+)"/m);

          if (!pyMatch) throw new Error('Could not find Python package version');

          const actual = {
            npm: npmPackage,
            schema,
            python: pyMatch[1],
          };
          const expected = {
            npm: expectedNpm,
            schema: expectedSchema,
            python: expectedSchema,
          };

          for (const [name, version] of Object.entries(actual)) {
            if (version !== expected[name]) {
              throw new Error(
                `${name} version ${version} does not match requested ${expected[name]}`,
              );
            }
          }

          console.log(
            `Verified npm ${actual.npm}; schema and Python ${actual.schema}`,
          );
          NODE
        env:
          INPUT_NPM_VERSION: ${{ inputs.npm_version }}
          INPUT_SCHEMA_VERSION: ${{ inputs.schema_version }}
      - run: npm run check:versions
      - run: npm run release:all
      - run: npm --workspace @invisra/printspec pack --dry-run
      - run: echo "Release dry-run complete for npm ${{ inputs.npm_version }} and schema/Python ${{ inputs.schema_version }}. Publishing remains disabled while dry_run=${{ inputs.dry_run }}."

  # npm trusted publishing (OIDC). Runs only on a real release (dry_run=false),
  # after every release-checks step (including the Python build) has passed.
  # No npm token is stored: npm exchanges the GitHub OIDC token for a
  # short-lived registry credential via the trusted publisher configured on
  # npmjs.com for @invisra/printspec, and attaches build provenance.
  publish-npm:
    needs: release-checks
    if: ${{ inputs.dry_run == false }}
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          cache: npm
      # Trusted publishing needs npm >= 11.5.1; the npm bundled with Node 24 can
      # be older, so upgrade the CLI before publishing.
      - run: npm install -g npm@latest
      - run: npm ci
      # Populate packages/typescript/schemas before packing (mirrors release:node).
      - run: npm run sync:schemas
      - run: npm publish --workspace @invisra/printspec --provenance --access public

  # PyPI trusted publishing (OIDC). Dormant until the invisra PyPI org and its
  # trusted publisher are approved -- guarded by the separate publish_pypi input
  # (default false) so npm releases are not blocked in the meantime. Once
  # approved, run the workflow with dry_run=false and publish_pypi=true. No PyPI
  # token is stored: the OIDC identity authenticates the upload.
  publish-pypi:
    needs: release-checks
    if: ${{ inputs.dry_run == false && inputs.publish_pypi }}
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip build
      - run: python -m build packages/python
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: packages/python/dist/
