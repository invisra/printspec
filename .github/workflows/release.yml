name: Release
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to dry-run or release, for example 0.1.0'
        required: true
        default: '0.1.0'
      dry_run:
        description: 'Keep publishing disabled'
        required: true
        default: true
        type: boolean
jobs:
  release-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: npm install
      - name: Verify requested version matches package versions
        run: |
          node - <<'NODE'
          import { readFileSync } from 'node:fs';
          const expected = process.env.INPUT_VERSION;
          const root = JSON.parse(readFileSync('package.json', 'utf8')).version;
          const ts = JSON.parse(readFileSync('packages/typescript/package.json', 'utf8')).version;
          const pyMatch = readFileSync('packages/python/pyproject.toml', 'utf8').match(/^version = "([^"]+)"/m);
          if (!pyMatch) throw new Error('Could not find Python package version');
          const versions = {root, typescript: ts, python: pyMatch[1]};
          for (const [name, version] of Object.entries(versions)) {
            if (version !== expected) throw new Error(`${name} version ${version} does not match workflow input ${expected}`);
          }
          console.log(`Version ${expected} verified across packages`);
          NODE
        env:
          INPUT_VERSION: ${{ inputs.version }}
      - run: npm run release:all
      - run: npm --workspace @invisra/printspec pack --dry-run
      - run: echo "Release dry-run complete for ${{ inputs.version }}. Publishing remains disabled while dry_run=${{ inputs.dry_run }}."

  # Future npm trusted publishing can be added as a separate job guarded by:
  # if: ${{ inputs.dry_run == false }}
  # environment: release
  # permissions: { id-token: write, contents: read }
  # Do not add npm tokens to the repository.

  # Future PyPI trusted publishing can be added as a separate job guarded by:
  # if: ${{ inputs.dry_run == false }}
  # environment: release
  # permissions: { id-token: write, contents: read }
  # Do not add PyPI tokens to the repository.
