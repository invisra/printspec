name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - run: npm install
      - run: npm run sync:schemas
      - run: npm run check:versions
      - run: npm run lint:ts
      - run: npm test
      - run: npm --workspace @invisra/printspec pack --dry-run
      - run: npm run smoke:npm
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e "packages/python[test]" ruff mypy
      - run: npm run lint:python
      - run: pytest tests/python tests/schema
      - run: python -m pip install build twine
      - run: python -m build packages/python
      - run: python -m twine check packages/python/dist/*
      - run: python -m pip install --force-reinstall packages/python/dist/*.whl
      - run: python -m printspec.cli validate examples/part-families/rounded-rectangular-plate.basic.json
      - run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from printspec import validate_printspec

          spec = json.loads(Path("examples/part-families/rounded-rectangular-plate.basic.json").read_text())
          result = validate_printspec(spec)
          assert result["valid"], result
          print("wheel validation smoke test passed")
          PY
